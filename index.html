<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My OHN Tour — Mappa personalizzata per Open House Napoli</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>My OHN Tour</h1>
      <span class="brand-sub">Open House Napoli</span>
      <a class="brand-mail" href="mailto:ubiqua.edu@gmail.com">ubiqua.edu@gmail.com</a>
    </div>
    <input id="search" type="search" placeholder="Cerca per titolo o indirizzo…" autocomplete="off" />
    <nav class="topbar-actions">
      <input id="adminPass" class="pass-admin" type="password" placeholder="🔒 Password" autocomplete="off"
        title="Password per abilitare il tasto di cancellazione (✕)" />
      <span id="contatore" class="contatore" hidden></span>
    </nav>
  </header>

  <!-- Strumenti admin: appaiono dopo lo sblocco con password (o ?impostazioni=1).
       Sotto l'header (richiesta: raggiungibili anche da mobile senza scroll). -->
  <div id="adminBar" hidden>
    <button id="importFileBtn" class="btn btn-ghost btn-small" type="button"
      title="1) SUL SITO OHN apri «My tour» (preferiti) e salva la pagina con Ctrl+S scegliendo «Pagina web, completa» — crea il file .html + una cartella «…_files» con le foto. 2) QUI scegli il file .html e, se vuoi le miniature, la cartella. Aggiorna orari/indirizzi, ripristina le tappe cancellate e aggiunge le località nuove.">📄 Importa HTML</button>
    <input id="importFileInput" type="file" accept=".html,.htm" hidden />
    <input id="importFotoInput" type="file" webkitdirectory hidden />
    <button id="importFotoBtn" class="btn btn-ghost btn-small" type="button"
      title="Opzionale, per le miniature: scegli la cartella «Pagina web, completa _files» creata da Ctrl+S (contiene già le foto scaricate dal browser). L'app le ridimensiona e le incorpora nei dati.">🖼 Cartella foto</button>
    <button id="esportaStatoBtn" class="btn btn-ghost btn-small" type="button"
      title="Scarica un JSON con dati importati, correzioni, esclusioni e scelte — per trasferirli su un altro dispositivo">⬇ Esporta stato</button>
    <button id="importaStatoBtn" class="btn btn-ghost btn-small" type="button"
      title="Ripristina un JSON esportato con «⬇ Esporta stato» su un altro dispositivo">⬆ Importa stato</button>
    <input id="importaStatoInput" type="file" accept=".json" hidden />
    <button id="svuotaDatiBtn" class="btn btn-ghost btn-small" type="button"
      title="Cancella TUTTI i dati locali (dati importati, correzioni, segnalibri, esclusioni): l'app riparte vuota, pronta per l'import della nuova edizione">🗑 Svuota dati</button>
  </div>

  <main class="layout">
    <section class="map-wrap" aria-label="Mappa dei luoghi">
      <div id="map"></div>
    </section>

    <aside class="list-wrap" aria-label="Elenco dei luoghi">
      <div class="list-header">
        <h2>Luoghi <span id="conteggio"></span></h2>
        <button id="resetBtn" class="btn btn-ghost btn-small" type="button">Reset filtri</button>
      </div>
      <div id="riepilogoConflitti" class="riepilogo-conflitti" hidden>
        <div class="riepilogo-head">
          <h3 id="riepilogoTitolo">Conflitti d'orario</h3>
          <button id="chiudiConflitti" class="btn btn-ghost btn-small" type="button"
            title="Nasconde il riepilogo (riappare al prossimo cambio di stella o di giornata)">Nascondi</button>
        </div>
        <div id="riepilogoLista" class="riepilogo-lista"></div>
      </div>
      <div class="filtri-giornata" role="group" aria-label="Filtro per giornata">
        <button class="giorno-btn attivo" data-giorno="" type="button">Tutti</button>
        <button class="giorno-btn" data-giorno="ven" type="button">Ven 2</button>
        <button class="giorno-btn" data-giorno="sab" type="button">Sab 3</button>
        <button class="giorno-btn" data-giorno="dom" type="button">Dom 4</button>
        <span id="tourCount" class="stato-tour" hidden></span>
        <span id="conflittiCount" class="stato-conflitti" hidden></span>
        <span id="legendaVicini" class="legenda-vicini" hidden
          title="Luoghi aperti solo questo giorno e vicini (≤ 500 m) a un luogo del tour">🟠 solo questo giorno, vicini al tour</span>
        <button id="resetScelteBtn" class="btn btn-ghost btn-small" type="button" hidden
          title="Svuota i segnalibri del tour (di questo giorno, o tutti in vista “Tutti”)">↺ Reset segnalibri</button>
      </div>
      <div id="list" class="list"></div>
    </aside>
  </main>

  <!-- Banner per il posizionamento dei luoghi senza coordinate (coda automatica dopo l'import) -->
  <div id="posizionaBanner" hidden>
    <p id="posizionaTesto"></p>
    <button id="posizionaSalta" class="btn btn-ghost btn-small" type="button">Salta</button>
    <button id="posizionaAnnulla" class="btn btn-ghost btn-small" type="button">Annulla</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
